name: Frontend — Build, Push & Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/northstar-frontend

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # JOB 1 — Build the Docker image and push it to Docker Hub
  # ────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short

      # VITE_API_URL baked into the React bundle at build time
      # Set this secret to your EC2 public IP or domain, e.g.:
      #   http://<EC2-PUBLIC-IP>:3001/api   (if no domain yet)
      #   https://api.yourdomain.com/api    (once you have a domain)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "Pushed ${{ steps.meta.outputs.tags }}"

  # ────────────────────────────────────────────────────────────────────────
  # JOB 2 — SSH into EC2 and deploy the new image
  #          Only runs on push to main (never on PRs)
  # ────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy frontend on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            echo "=== Logging in to Docker Hub ==="
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "=== Pulling latest frontend image ==="
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/northstar-frontend:latest

            echo "=== Stopping old container (if running) ==="
            docker stop northstar-frontend || true
            docker rm   northstar-frontend || true

            echo "=== Starting new container ==="
            docker run -d \
              --name northstar-frontend \
              --restart unless-stopped \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/northstar-frontend:latest

            echo "=== Waiting for health check ==="
            sleep 5
            docker exec northstar-frontend wget -qO- http://localhost:80/ || echo "Health check pending..."

            echo "=== Cleaning up unused images ==="
            docker image prune -f

            echo "=== Deploy complete ==="
